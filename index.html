<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>클창서버 LIVE 전광판</title>
  <style>
    :root {
      --bg: #0e1117;
      --card-bg: #161b22;
      --border: #30363d;
      --live-red: #ff334b;
      --offline-gray: #6e7681;
      --accent-blue: #58a6ff;
      --text: #f0f6fc;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .title-box h1 {
      font-size: 22px;
      font-weight: 800;
    }
    .title-box p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .badge-counter {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .badge-counter .live-num {
      color: var(--live-red);
    }

    /* 통합 그리드 */
    .stream-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card.is-live {
      border-color: rgba(255, 51, 75, 0.4);
    }

    /* 16:9 미디어 영역 */
    .media-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }
    .media-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 오프라인 대기 화면 */
    .offline-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #11141a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }
    .offline-placeholder:hover {
      background: #161a22;
    }
    .profile-img {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: #21262d;
    }
    .offline-tag {
      font-size: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* 카드 하단 정보 */
    .card-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tags-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .status-badge.live {
      background: var(--live-red);
      color: #fff;
    }
    .status-badge.offline {
      background: var(--border);
      color: var(--muted);
    }
    .role-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent-blue);
    }

    .stream-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stream-title.muted {
      color: var(--muted);
      font-weight: 400;
    }
    .stream-author {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="title-box">
      <h1>🏰 클창서버 LIVE 전광판</h1>
      <p>실시간 라이브 및 멤버 방송국 전체보기</p>
    </div>
    <div class="badge-counter">
      ON AIR: <span class="live-num" id="liveCount">0</span> / <span id="totalCount">0</span>
    </div>
  </header>

  <div class="stream-grid" id="streamGrid">
    <div style="color: var(--muted); font-size: 14px;">멤버 현황 불러오는 중...</div>
  </div>

  <script>
    // 클창서버 멤버 목록
    const SERVER_MEMBERS = [
      { id: "cnsgkcnehd74", name: "조경훈", role: "수장" },
      { id: "gudcjf604", name: "블랙워크", role: "건축가" },
      { id: "streamer_id_3", name: "멤버3", role: "광부" },
      { id: "streamer_id_4", name: "멤버4", role: "모험가" },
      { id: "streamer_id_5", name: "멤버5", role: "상인" }
    ];

    document.getElementById("totalCount").innerText = SERVER_MEMBERS.length;

    // SOOP 라이브 상태 확인
    async function checkStatus(userId) {
      try {
        const res = await fetch(`https://live.sooplive.co.kr/afreeca/live_status.action?szBid=${userId}`);
        const data = await res.json();
        return {
          isLive: data.REAL_BROAD === "Y" || data.RESULT === 1,
          title: data.BROAD_TITLE || "클창서버 라이브"
        };
      } catch {
        return { isLive: false };
      }
    }

    async function updateDashboard() {
      const grid = document.getElementById("streamGrid");
      const list = [];

      for (const m of SERVER_MEMBERS) {
        const status = await checkStatus(m.id);
        list.push({ ...m, ...status });
      }

      // 라이브 중인 멤버를 먼저 앞에 정렬
      list.sort((a, b) => (b.isLive ? 1 : 0) - (a.isLive ? 1 : 0));

      const liveTotal = list.filter(m => m.isLive).length;
      document.getElementById("liveCount").innerText = liveTotal;

      grid.innerHTML = list.map(m => {
        // 프로필 이미지 URL (SOOP 방송국 기본 로고 경로)
        const profileUrl = `https://stimg.sooplive.co.kr/LOGO/${m.id.slice(0, 2)}/${m.id}/${m.id}.jpg`;

        if (m.isLive) {
          // 라이브 ON 카드
          return `
            <div class="card is-live">
              <div class="media-wrap">
                <iframe 
                  src="https://play.sooplive.co.kr/${m.id}/embed" 
                  allowfullscreen 
                  allow="autoplay; encrypted-media">
                </iframe>
              </div>
              <div class="card-info">
                <div class="tags-row">
                  <span class="status-badge live">● LIVE</span>
                  <span class="role-badge">${m.role}</span>
                </div>
                <div class="stream-title" title="${m.title}">${m.title}</div>
                <div class="stream-author">${m.name} (@${m.id})</div>
              </div>
            </div>
          `;
        } else {
          // 오프라인 카드 (클릭 시 방송국 이동)
          return `
            <div class="card">
              <div class="media-wrap">
                <a class="offline-placeholder" href="https://ch.sooplive.co.kr/${m.id}" target="_blank">
                  <img class="profile-img" src="${profileUrl}" onerror="this.src='https://res.sooplive.co.kr/images/mobile/common/no_profile.png'" alt="${m.name}" />
                  <span class="offline-tag">방송국 바로가기 ↗</span>
                </a>
              </div>
              <div class="card-info">
                <div class="tags-row">
                  <span class="status-badge offline">OFFLINE</span>
                  <span class="role-badge">${m.role}</span>
                </div>
                <div class="stream-title muted">현재 오프라인 상태입니다</div>
                <div class="stream-author">${m.name} (@${m.id})</div>
              </div>
            </div>
          `;
        }
      }).join("");
    }

    // 1분 간격 갱신
    updateDashboard();
    setInterval(updateDashboard, 60000);
  </script>
</body>
</html>
