<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>클창서버 LIVE 전광판</title>
  <style>
    :root {
      --bg: #0e1117;
      --card-bg: #161b22;
      --border: #30363d;
      --live-red: #ff334b;
      --accent-blue: #58a6ff;
      --text: #f0f6fc;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .title-box h1 {
      font-size: 22px;
      font-weight: 800;
    }
    .title-box p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .badge-counter {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .badge-counter .live-num {
      color: var(--live-red);
    }

    .stream-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #58a6ff;
    }
    .card.is-live {
      border-color: rgba(255, 51, 75, 0.5);
    }
    .card.is-live:hover {
      border-color: var(--live-red);
    }

    .media-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      overflow: hidden;
    }
    .thumb-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .offline-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #11141a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .profile-img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: #21262d;
    }
    .offline-text {
      font-size: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .card-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tags-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .status-badge.live {
      background: var(--live-red);
      color: #fff;
    }
    .status-badge.offline {
      background: var(--border);
      color: var(--muted);
    }
    .role-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent-blue);
    }

    .stream-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stream-title.muted {
      color: var(--muted);
      font-weight: 400;
    }
    .stream-author {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="title-box">
      <h1>🏰 클창서버 LIVE 전광판</h1>
      <p>클릭 시 해당 스트리머 방송국/플레이어로 즉시 이동합니다</p>
    </div>
    <div class="badge-counter">
      ON AIR: <span class="live-num" id="liveCount">0</span> / <span id="totalCount">0</span>
    </div>
  </header>

  <div class="stream-grid" id="streamGrid">
    <div style="color: var(--muted); font-size: 14px;">상태 확인 중...</div>
  </div>

  <script>
    // 클창서버 멤버 목록 (실제 SOOP 방송국 아이디를 입력해주세요)
    const SERVER_MEMBERS = [
      { id: "cnsgkcnehd74", name: "조경훈", role: "수장" },
      { id: "gudcjf604", name: "블랙워크", role: "건축가" },
      { id: "아이디3", name: "멤버3", role: "광부" }
    ];

    document.getElementById("totalCount").innerText = SERVER_MEMBERS.length;

    // 실시간 라이브 썸네일 이미지 로드 기반 판별 (API 차단/CORS 무관)
    function checkLiveByImage(userId) {
      return new Promise((resolve) => {
        const img = new Image();
        const timestamp = Date.now();
        const liveThumbUrl = `https://liveimg.sooplive.co.kr/m/${userId}?t=${timestamp}`;

        const timer = setTimeout(() => {
          resolve({ isLive: false, thumb: null });
        }, 2500);

        img.onload = function() {
          clearTimeout(timer);
          // 방송 중이 아닐 때 SOOP은 기본 1x1 또는 no_image를 반환하므로 크기로 검증
          if (img.naturalWidth > 10 && img.naturalHeight > 10) {
            resolve({ isLive: true, thumb: liveThumbUrl });
          } else {
            resolve({ isLive: false, thumb: null });
          }
        };

        img.onerror = function() {
          clearTimeout(timer);
          resolve({ isLive: false, thumb: null });
        };

        img.src = liveThumbUrl;
      });
    }

    async function updateDashboard() {
      const grid = document.getElementById("streamGrid");

      const promises = SERVER_MEMBERS.map(async (m) => {
        const status = await checkLiveByImage(m.id);
        return { ...m, ...status };
      });

      const list = await Promise.all(promises);

      // 라이브 중인 멤버 우선 정렬
      list.sort((a, b) => (b.isLive ? 1 : 0) - (a.isLive ? 1 : 0));

      const liveTotal = list.filter(m => m.isLive).length;
      document.getElementById("liveCount").innerText = liveTotal;

      grid.innerHTML = list.map(m => {
        const profileUrl = `https://stimg.sooplive.co.kr/LOGO/${m.id.slice(0, 2)}/${m.id}/${m.id}.jpg`;
        const targetLink = m.isLive 
          ? `https://play.sooplive.co.kr/${m.id}` 
          : `https://ch.sooplive.co.kr/${m.id}`;

        if (m.isLive) {
          return `
            <a class="card is-live" href="${targetLink}" target="_blank">
              <div class="media-wrap">
                <img class="thumb-img" src="${m.thumb}" alt="${m.name}" />
              </div>
              <div class="card-info">
                <div class="tags-row">
                  <span class="status-badge live">● LIVE</span>
                  <span class="role-badge">${m.role}</span>
                </div>
                <div class="stream-title">클창서버 라이브 방송 중</div>
                <div class="stream-author">${m.name} (@${m.id}) ↗</div>
              </div>
            </a>
          `;
        } else {
          return `
            <a class="card" href="${targetLink}" target="_blank">
              <div class="media-wrap">
                <div class="offline-placeholder">
                  <img class="profile-img" src="${profileUrl}" onerror="this.src='https://res.sooplive.co.kr/images/mobile/common/no_profile.png'" alt="${m.name}" />
                  <span class="offline-text">방송국 바로가기 ↗</span>
                </div>
              </div>
              <div class="card-info">
                <div class="tags-row">
                  <span class="status-badge offline">OFFLINE</span>
                  <span class="role-badge">${m.role}</span>
                </div>
                <div class="stream-title muted">현재 방송 중이 아닙니다</div>
                <div class="stream-author">${m.name} (@${m.id})</div>
              </div>
            </a>
          `;
        }
      }).join("");
    }

    updateDashboard();
    setInterval(updateDashboard, 30000);
  </script>
</body>
</html>
