<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>클창서버 LIVE 전광판</title>
  <style>
    :root {
      --bg: #0e1117;
      --card-bg: #161b22;
      --border: #30363d;
      --live-red: #ff334b;
      --accent-blue: #58a6ff;
      --text: #f0f6fc;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .title-box h1 {
      font-size: 22px;
      font-weight: 800;
    }
    .title-box p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .badge-counter {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .badge-counter .live-num {
      color: var(--live-red);
    }

    /* 카드 그리드 */
    .stream-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #58a6ff;
    }
    .card.is-live {
      border-color: rgba(255, 51, 75, 0.5);
    }
    .card.is-live:hover {
      border-color: var(--live-red);
    }

    /* 16:9 미디어 썸네일 영역 */
    .media-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      overflow: hidden;
    }
    .thumb-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.9;
    }

    .offline-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #11141a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .profile-img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: #21262d;
    }
    .offline-text {
      font-size: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* 카드 하단 정보 */
    .card-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tags-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .status-badge.live {
      background: var(--live-red);
      color: #fff;
    }
    .status-badge.offline {
      background: var(--border);
      color: var(--muted);
    }
    .role-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent-blue);
    }

    .stream-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stream-title.muted {
      color: var(--muted);
      font-weight: 400;
    }
    .stream-author {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="title-box">
      <h1>🏰 클창서버 LIVE 전광판</h1>
      <p>클릭 시 해당 스트리머 방송/방송국으로 즉시 이동합니다</p>
    </div>
    <div class="badge-counter">
      ON AIR: <span class="live-num" id="liveCount">0</span> / <span id="totalCount">0</span>
    </div>
  </header>

  <div class="stream-grid" id="streamGrid">
    <div style="color: var(--muted); font-size: 14px;">멤버 방송 상태 확인 중...</div>
  </div>

  <script>
    // 클창서버 스트리머 목록 (실제 SOOP 방송국 ID를 입력하세요)
    const SERVER_MEMBERS = [
      { id: "cnsgkcnehd74", name: "조경훈", role: "수장" },
      { id: "gudcjf604", name: "블랙워크", role: "건축가" },
      { id: "streamer_id_3", name: "멤버3", role: "광부" },
      { id: "streamer_id_4", name: "멤버4", role: "모험가" },
      { id: "streamer_id_5", name: "멤버5", role: "상인" }
    ];

    document.getElementById("totalCount").innerText = SERVER_MEMBERS.length;

    // CORS 우회 프록시를 통해 SOOP 라이브 상태 조회
    async function checkStatus(userId) {
      try {
        const targetUrl = `https://live.sooplive.co.kr/afreeca/live_status.action?szBid=${userId}`;
        // allorigins 프록시 사용 (CORS 차단 방지)
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        
        const res = await fetch(proxyUrl);
        const jsonWrapper = await res.json();
        const data = JSON.parse(jsonWrapper.contents);

        const isLive = data.REAL_BROAD === "Y" || data.RESULT === 1;
        return {
          isLive: isLive,
          title: data.BROAD_TITLE || "클창서버 라이브",
          broadNo: data.BROAD_NO
        };
      } catch (err) {
        return { isLive: false };
      }
    }

    async function updateDashboard() {
      const grid = document.getElementById("streamGrid");
      const list = [];

      for (const m of SERVER_MEMBERS) {
        const status = await checkStatus(m.id);
        list.push({ ...m, ...status });
      }

      // 라이브 중인 멤버 우선 정렬
      list.sort((a, b) => (b.isLive ? 1 : 0) - (a.isLive ? 1 : 0));

      const liveTotal = list.filter(m => m.isLive).length;
      document.getElementById("liveCount").innerText = liveTotal;

      grid.innerHTML = list.map(m => {
        const profileUrl = `https://stimg.sooplive.co.kr/LOGO/${m.id.slice(0, 2)}/${m.id}/${m.id}.jpg`;
        
        // 클릭 시 이동할 URL (라이브 중이면 웹 플레이어 주소, 오프라인이면 방송국 홈)
        const targetLink = m.isLive 
          ? `https://play.sooplive.co.kr/${m.id}` 
          : `https://ch.sooplive.co.kr/${m.id}`;

        if (m.isLive) {
          // 라이브 카드 (실시간 썸네일 노출 및 클릭 시 새 탭 이동)
          const liveThumb = m.broadNo 
            ? `https://liveimg.sooplive.co.kr/m/${m.broadNo}?${Date.now()}`
            : profileUrl;

          return `
            <a class="card is-live" href="${targetLink}" target="_blank">
              <div class="media-wrap">
                <img class="thumb-img" src="${liveThumb}" onerror="this.src='${profileUrl}'" alt="${m.name}" />
              </div>
              <div class="card-info">
                <div class="tags-row">
                  <span class="status-badge live">● LIVE</span>
                  <span class="role-badge">${m.role}</span>
                </div>
                <div class="stream-title" title="${m.title}">${m.title}</div>
                <div class="stream-author">${m.name} (@${m.id}) ↗</div>
              </div>
            </a>
          `;
        } else {
          // 오프라인 카드 (프로필 노출 및 클릭 시 방송국 홈 이동)
          return `
            <a class="card" href="${targetLink}" target="_blank">
              <div class="media-wrap">
                <div class="offline-placeholder">
                  <img class="profile-img" src="${profileUrl}" onerror="this.src='https://res.sooplive.co.kr/images/mobile/common/no_profile.png'" alt="${m.name}" />
                  <span class="offline-text">방송국 바로가기 ↗</span>
                </div>
              </div>
              <div class="card-info">
                <div class="tags-row">
                  <span class="status-badge offline">OFFLINE</span>
                  <span class="role-badge">${m.role}</span>
                </div>
                <div class="stream-title muted">현재 방송 중이 아닙니다</div>
                <div class="stream-author">${m.name} (@${m.id})</div>
              </div>
            </a>
          `;
        }
      }).join("");
    }

    // 최초 실행 및 60초마다 갱신
    updateDashboard();
    setInterval(updateDashboard, 60000);
  </script>
</body>
</html>
